[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendbot"
version = "0.1.0"
description = "Эксперимент: поиск трендов TikTok через браузер на своём компьютере"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45"]

[project.optional-dependencies]
dev = ["pytest>=8", "imageio-ffmpeg>=0.5"]  # ffmpeg — для тестового видео в сквозном тесте

[project.scripts]
trendbot = "trendbot.cli:main"

[tool.setuptools.packages.find]
include = ["trendbot*"]
