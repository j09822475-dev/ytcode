# Скопируйте в trendbot.toml и настройте под свою нишу.

[channel]
niche = "лайфхаки для продуктивности и учёбы"
language = "ru"

[collect]
# Ключевые слова и хэштеги ниши: по ним открываются поиск и страницы хэштегов.
keywords = ["продуктивность", "лайфхак учеба"]
hashtags = ["лайфхак", "продуктивность"]
feed_videos = 40          # сколько роликов просмотреть в ленте «Для вас» за запуск
search_scrolls = 4        # сколько раз прокрутить выдачу поиска / хэштега
watch_seconds = [3, 8]    # сколько секунд «смотреть» каждый ролик в ленте (случайно в диапазоне)
pause_seconds = [2, 5]    # пауза между действиями
headless = false          # браузер видно на экране; можно вмешаться (капча, вход)
browser_channel = ""      # "chrome" — использовать установленный Google Chrome вместо Chromium от Playwright
sound_pages = 5           # сколько страниц самых частых звуков открыть, чтобы замерить число роликов с ними

[trends]
lookback_hours = 72       # «свежими» считаются ролики не старше этого
min_videos_per_sound = 2  # звук/хэштег попадает в отчёт, если встречен хотя бы в N роликах
top_n = 15

[frames]
top_videos = 8            # у скольких лучших роликов снимать кадры
timestamps = [0.5, 2.5, 6.0]
